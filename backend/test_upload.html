<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Izakaya Lens – Overlay Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0f0d0b;
      --paper: #f7f2ea;
      --lantern: #e8420a;
      --ember: #f4a140;
      --mist: #c8bfb0;
      --smoke: #2e2924;
      --cream: #fdf8f0;
      --safe: #2d7a4f;
      --warn: #c97a00;
      --danger: #c0392b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #141210;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* ── Phone Shell ── */
    .phone {
      width: 390px;
      background: var(--ink);
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 0 0 2px #3a3530, 0 0 0 8px #0a0806, 0 50px 100px rgba(0, 0, 0, .8);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 14px 28px 6px;
      font-size: 12px;
      font-weight: 500;
      color: #7a7068;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 20px 12px;
    }

    .app-logo {
      font-family: 'Shippori Mincho', serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--paper);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .logo-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lantern);
      box-shadow: 0 0 10px var(--lantern);
    }

    .hint-label {
      font-size: 11px;
      color: var(--mist);
      background: var(--smoke);
      padding: 5px 12px;
      border-radius: 20px;
    }

    /* ── Photo Container ── */
    .photo-container {
      position: relative;
      margin: 0 16px;
      border-radius: 20px;
      overflow: hidden;
      background: #1a1510;
      border: 1px solid #2a2520;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .photo-container img {
      width: 100%;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* zoom layer */
    #zoomLayer {
      position: relative;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* zoom hint badge */
    #zoomHint {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 5;
      pointer-events: none;
      background: rgba(46,41,36,0.88);
      color: #f7f2ea;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: .04em;
      backdrop-filter: blur(4px);
      transition: opacity .3s;
    }
    #zoomHint.hidden { opacity: 0; }

    /* ── Hotspots ── */
    .hotspot {
      position: absolute;
      border-radius: 8px;
      border: 2px solid rgba(232, 66, 10, 0);
      background: rgba(232, 66, 10, 0);
      cursor: pointer;
      transition: all .15s ease;
    }

    .hotspot:hover,
    .hotspot.pulsing {
      border-color: rgba(232, 66, 10, .7);
      background: rgba(232, 66, 10, .12);
      box-shadow: 0 0 0 3px rgba(232, 66, 10, .15), inset 0 0 12px rgba(232, 66, 10, .08);
    }

    .hotspot.active {
      border-color: var(--lantern);
      background: rgba(232, 66, 10, .2);
      box-shadow: 0 0 0 4px rgba(232, 66, 10, .25);
    }

    .tap-badge {
      position: absolute;
      right: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--lantern);
      box-shadow: 0 0 12px rgba(232, 66, 10, .6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: white;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }

    .hotspot:hover .tap-badge,
    .hotspot.pulsing .tap-badge {
      opacity: 1;
    }

    /* ── EN Overlay Labels ── */
    .en-overlay-label {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 8, 5, .82);
      backdrop-filter: blur(2px);
      border-radius: 6px;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 8px;
      pointer-events: none;
      animation: fadeInLabel .2s ease forwards;
    }

    @keyframes fadeInLabel {
      from {
        opacity: 0;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .en-overlay-label.visible {
      display: flex;
    }

    .en-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--paper);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .en-price {
      font-size: 11px;
      color: var(--ember);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Detected Bar ── */
    .detected-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      opacity: 0;
      transition: opacity .4s .2s;
    }

    .detected-bar.visible {
      opacity: 1;
    }

    .detected-count {
      font-size: 12px;
      color: var(--mist);
    }

    .detected-count strong {
      color: var(--ember);
    }

    .overlay-toggle-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--smoke);
      border: 1px solid #3a3530;
      border-radius: 8px;
      padding: 4px 10px 4px 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: border-color .2s, background .2s;
    }

    .overlay-toggle-btn.on {
      border-color: var(--lantern);
      background: rgba(232, 66, 10, .12);
    }

    .ot-icon {
      font-size: 10px;
      font-weight: 700;
      color: var(--mist);
    }

    .overlay-toggle-btn.on .ot-icon {
      color: var(--ember);
    }

    .ot-label {
      font-size: 11px;
      color: var(--mist);
      font-weight: 500;
    }

    .ot-switch {
      width: 28px;
      height: 16px;
      border-radius: 8px;
      background: #3a3530;
      position: relative;
      transition: background .2s;
      margin-left: 2px;
    }

    .ot-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #7a7068;
      transition: transform .2s, background .2s;
    }

    .overlay-toggle-btn.on .ot-switch {
      background: var(--lantern);
    }

    .overlay-toggle-btn.on .ot-switch::after {
      transform: translateX(12px);
      background: white;
    }

    .currency-toggle {
      display: flex;
      background: var(--smoke);
      border-radius: 8px;
      overflow: hidden;
    }

    .cur-btn {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      color: #7a7068;
      cursor: pointer;
      border: none;
      background: none;
      font-family: 'DM Sans', sans-serif;
      transition: all .15s;
    }

    .cur-btn.active {
      background: var(--lantern);
      color: white;
    }

    /* ── Instruction Banner ── */
    .instruction-banner {
      margin: 0 16px 10px;
      background: var(--smoke);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity .4s .4s;
    }

    .instruction-banner.visible {
      opacity: 1;
    }

    .ib-icon {
      font-size: 18px;
    }

    .ib-text {
      font-size: 12px;
      color: var(--mist);
      line-height: 1.5;
    }

    .ib-text strong {
      color: var(--paper);
    }

    /* ── Bottom Sheet ── */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      z-index: 20;
      pointer-events: none;
      transition: background .25s;
      border-radius: 48px;
      overflow: hidden;
    }

    .sheet-backdrop.open {
      background: rgba(0, 0, 0, .55);
      pointer-events: auto;
    }

    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--cream);
      border-radius: 28px 28px 0 0;
      transform: translateY(100%);
      transition: transform .32s cubic-bezier(.32, 0, .67, 0);
      z-index: 21;
      overflow: hidden;
    }

    .bottom-sheet.open {
      transform: translateY(0);
      transition: transform .32s cubic-bezier(.33, 1, .68, 1);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: #ddd6ca;
      margin: 12px auto 0;
    }

    .sheet-inner {
      padding: 16px 22px 28px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .sheet-jp {
      font-family: 'Shippori Mincho', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: .06em;
    }

    .sheet-en {
      font-size: 13px;
      color: #7a6f63;
      margin-top: 2px;
      line-height: 1.4;
    }

    .sheet-jpy {
      font-family: 'Shippori Mincho', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      text-align: right;
    }

    .sheet-usd {
      font-size: 12px;
      color: var(--warn);
      font-weight: 500;
      margin-top: 2px;
      text-align: right;
    }

    .sheet-divider {
      height: 1px;
      background: #ede8e0;
      margin: 12px 0;
    }

    .sheet-desc {
      font-size: 13px;
      color: #6b5f52;
      line-height: 1.75;
      margin-bottom: 14px;
    }

    .allergy-heading {
      font-size: 10px;
      color: #a89f94;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .allergy-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .tag-warn {
      background: #fff4e0;
      color: var(--warn);
      border: 1px solid #ffe5a0;
    }

    .tag-safe {
      background: #e8f5ee;
      color: var(--safe);
      border: 1px solid #b5ddc7;
    }

    .tag-danger {
      background: #fdecea;
      color: var(--danger);
      border: 1px solid #f9c6c0;
    }

    .ai-disclaimer {
      margin-top: 14px;
      background: #fff8ed;
      border: 1px solid #ffe5a0;
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .ai-disclaimer span {
      font-size: 14px;
    }

    .ai-disclaimer p {
      font-size: 11px;
      color: #7a6030;
      line-height: 1.6;
    }

    .confidence-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .conf-high {
      background: #e8f5ee;
      color: var(--safe);
    }

    .conf-low {
      background: #fff4e0;
      color: var(--warn);
    }

    .close-sheet-btn {
      position: absolute;
      top: 14px;
      right: 18px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ede8e0;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #6b5f52;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Scan Overlay ── */
    .scan-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 8, 6, .75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 20px;
      z-index: 10;
      transition: opacity .4s ease;
    }

    .scan-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .scan-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(232, 66, 10, .2);
      border-top-color: var(--lantern);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .scan-text {
      font-size: 13px;
      color: var(--mist);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .scan-progress {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, .08);
      border-radius: 2px;
      overflow: hidden;
    }

    .scan-progress-fill {
      height: 100%;
      background: var(--lantern);
      border-radius: 2px;
      animation: progress 1.8s ease forwards;
    }

    @keyframes progress {
      from {
        width: 0
      }

      to {
        width: 100%
      }
    }

    /* ── Bottom padding ── */
    .bottom-pad {
      height: 34px;
    }
  </style>
</head>

<body>

  <div class="phone" id="phone">

    <div class="status-bar">
      <span>9:41</span>
      <div style="display:flex;gap:6px;align-items:center;font-size:11px">
        <span>&#9679;&#9679;&#9679;</span><span>WiFi</span><span>&#128267;</span>
      </div>
    </div>

    <div class="top-bar">
      <div class="app-logo">
        <div class="logo-dot"></div>
        Izakaya Lens
      </div>
      <div class="hint-label" id="hintLabel">Scanning&#8230;</div>
    </div>

    <!-- Photo + Hotspots -->
    <div class="photo-container" id="photoContainer">
      <!-- Zoom hint badge (outside zoom layer so it doesn't scale) -->
      <div id="zoomHint">🔍 Pinch or double-tap to zoom</div>

      <!-- Everything inside here scales together -->
      <div id="zoomLayer">
        <img src="/static/sample.png" id="menuPhoto">
      </div>

      <!-- Scan overlay -->
      <div class="scan-overlay" id="scanOverlay">
        <div class="scan-spinner"></div>
        <div class="scan-text">Recognising menu&#8230;</div>
        <div class="scan-progress">
          <div class="scan-progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- Detected bar -->
    <div class="detected-bar" id="detectedBar">
      <div class="detected-count" id="detectedCount"></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="overlay-toggle-btn" id="overlayToggleBtn" onclick="toggleOverlay()">
          <span class="ot-icon">EN</span>
          <span class="ot-label">Overlay</span>
          <span class="ot-switch"></span>
        </button>
        <div class="currency-toggle">
          <button class="cur-btn active" onclick="setCurrency('USD',this)">USD</button>
          <button class="cur-btn" onclick="setCurrency('EUR',this)">EUR</button>
          <button class="cur-btn" onclick="setCurrency('GBP',this)">GBP</button>
        </div>
      </div>
    </div>

    <div class="instruction-banner" id="instructionBanner">
      <div class="ib-icon">&#128070;</div>
      <div class="ib-text"><strong>Tap any highlighted item</strong> on the menu photo to see the English translation
        and allergy info.</div>
    </div>

    <div class="bottom-pad"></div>

    <!-- Sheet backdrop + bottom sheet -->
    <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
      <div class="sheet-handle"></div>
      <button class="close-sheet-btn" onclick="closeSheet()">&#10005;</button>
      <div class="sheet-inner" id="sheetContent"></div>
    </div>

  </div>

  <script>
    // ── Hardcoded test data ──
    const TEST_DATA = {
      "items": [
        {
          "name_jp": "いかの造り",
          "name_en": "Fresh Squid Sashimi",
          "description_en": "Enjoy thinly sliced raw squid, known for its delicate, slightly sweet flavor and firm, chewy texture. It's typically served with soy sauce and a touch of wasabi for a refreshing taste.",
          "price_jpy": 290,
          "allergens": ["Shellfish", "Soy"],
          "confidence": "high",
          "bbox": { "x": 23, "y": 66, "width": 26, "height": 141 }
        }
      ]
    };

    // ── Currency ──
    const RATES = { USD: 0.0067, EUR: 0.0062, GBP: 0.0053 };
    const SYMBOLS = { USD: '$', EUR: '€', GBP: '£' };
    let currentCurrency = 'USD';

    function formatPrice(jpy) {
      return SYMBOLS[currentCurrency] + (jpy * RATES[currentCurrency]).toFixed(2);
    }

    function setCurrency(cur, btn) {
      currentCurrency = cur;
      document.querySelectorAll('.cur-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // Update overlay labels
      TEST_DATA.items.forEach((item, i) => {
        const priceEl = document.querySelector('#enLabel' + i + ' .en-price');
        if (priceEl && item.price_jpy) priceEl.textContent = '≈ ' + formatPrice(item.price_jpy);
      });
    }

    // ── Pinch / pan / double-tap zoom ──
    (function initZoom() {
      const MIN_SCALE = 1, MAX_SCALE = 4, DOUBLE_TAP_ZOOM = 2.5, DOUBLE_TAP_MS = 300;
      const container = document.getElementById('photoContainer');
      const layer    = document.getElementById('zoomLayer');
      const hint     = document.getElementById('zoomHint');

      let scale = 1, panX = 0, panY = 0;
      const pointers = new Map();
      let prevDist = null, didDrag = false, totalMove = 0;
      let lastTap = { time: 0, x: 0, y: 0 };
      let hintTimer = null;

      function applyTransform() {
        layer.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
        container.style.cursor = scale > 1 ? 'grab' : 'default';
      }

      function clamp(x, y, s) {
        const w = container.clientWidth, h = container.clientHeight;
        return {
          x: Math.min(0, Math.max(x, w * (1 - s))),
          y: Math.min(0, Math.max(y, h * (1 - s))),
        };
      }

      function dismissHint() {
        clearTimeout(hintTimer);
        hint.classList.add('hidden');
      }

      function startHintTimer() {
        hintTimer = setTimeout(dismissHint, 3000);
      }
      startHintTimer();

      function coords(e) {
        const r = container.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      container.addEventListener('pointerdown', (e) => {
        container.setPointerCapture(e.pointerId);
        const pos = coords(e);
        pointers.set(e.pointerId, pos);

        if (pointers.size === 1) {
          prevDist = null; didDrag = false; totalMove = 0;
        } else if (pointers.size === 2) {
          const pts = [...pointers.values()];
          prevDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          didDrag = true;
        }
      });

      container.addEventListener('pointermove', (e) => {
        const pos = coords(e);
        const prev = pointers.get(e.pointerId);
        if (!prev) return;
        pointers.set(e.pointerId, pos);

        if (pointers.size === 1) {
          const dx = pos.x - prev.x, dy = pos.y - prev.y;
          totalMove += Math.abs(dx) + Math.abs(dy);
          if (totalMove > 8) didDrag = true;
          if (scale > 1) {
            const c = clamp(panX + dx, panY + dy, scale);
            panX = c.x; panY = c.y;
            applyTransform();
          }
        } else if (pointers.size === 2) {
          const pts = [...pointers.values()];
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          if (prevDist && prevDist !== 0) {
            const midX = (pts[0].x + pts[1].x) / 2;
            const midY = (pts[0].y + pts[1].y) / 2;
            const newScale = Math.min(Math.max(scale * (dist / prevDist), MIN_SCALE), MAX_SCALE);
            const ratio = newScale / scale;
            const c = clamp(midX * (1 - ratio) + panX * ratio, midY * (1 - ratio) + panY * ratio, newScale);
            scale = newScale; panX = c.x; panY = c.y;
            applyTransform();
            dismissHint();
          }
          prevDist = dist;
        }
      });

      function onUp(e) {
        const pos = coords(e);
        const size = pointers.size;

        // Double-tap detection
        if (size === 1 && !didDrag) {
          const now = Date.now();
          const d = Math.hypot(pos.x - lastTap.x, pos.y - lastTap.y);
          if (now - lastTap.time < DOUBLE_TAP_MS && d < 30) {
            if (Math.abs(scale - 1) < 0.15) {
              const ns = DOUBLE_TAP_ZOOM;
              const c = clamp(pos.x * (1 - ns), pos.y * (1 - ns), ns);
              scale = ns; panX = c.x; panY = c.y;
              dismissHint();
            } else {
              scale = 1; panX = 0; panY = 0;
            }
            applyTransform();
            lastTap = { time: 0, x: 0, y: 0 };
          } else {
            lastTap = { time: now, x: pos.x, y: pos.y };
          }
        }

        pointers.delete(e.pointerId);
        if (pointers.size === 1) { prevDist = null; totalMove = 0; didDrag = false; }
        if (pointers.size === 0) { prevDist = null; }
      }

      container.addEventListener('pointerup', onUp);
      container.addEventListener('pointercancel', onUp);

      // Suppress hotspot clicks after drag (capture phase)
      container.addEventListener('click', (e) => { if (didDrag) e.stopPropagation(); }, true);

      // Prevent browser-level pinch zoom globally (macOS trackpad fires ctrlKey+wheel)
      window.addEventListener('wheel', (e) => {
        if (e.ctrlKey) e.preventDefault();
      }, { passive: false });

      // Desktop: trackpad pinch (ctrlKey + wheel) → zoom image; two-finger scroll → pan
      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.ctrlKey) {
          const zoomFactor = 1 - e.deltaY * 0.01;
          const rect = container.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;
          const newScale = Math.min(Math.max(scale * zoomFactor, MIN_SCALE), MAX_SCALE);
          const ratio = newScale / scale;
          const c = clamp(mx * (1 - ratio) + panX * ratio, my * (1 - ratio) + panY * ratio, newScale);
          scale = newScale; panX = c.x; panY = c.y;
          applyTransform();
          dismissHint();
        } else if (scale > 1) {
          const c = clamp(panX - e.deltaX, panY - e.deltaY, scale);
          panX = c.x; panY = c.y;
          applyTransform();
        }
      }, { passive: false });
    })();

    // ── Build hotspots from data ──
    function buildOverlay() {
      const container = document.getElementById('zoomLayer');   // hotspots go inside zoom layer
      const img = document.getElementById('menuPhoto');
      const natW = img.naturalWidth;
      const natH = img.naturalHeight;
      const dispW = img.clientWidth;
      const dispH = img.clientHeight;
      const scaleX = dispW / natW;
      const scaleY = dispH / natH;

      TEST_DATA.items.forEach((item, i) => {
        const b = item.bbox;

        // Create hotspot
        const hs = document.createElement('div');
        hs.className = 'hotspot';
        hs.id = 'hs' + i;
        hs.style.left = (b.x * scaleX) + 'px';
        hs.style.top = (b.y * scaleY) + 'px';
        hs.style.width = (b.width * scaleX) + 'px';
        hs.style.height = (b.height * scaleY) + 'px';
        hs.onclick = () => openSheet(i);

        // Tap badge
        const badge = document.createElement('div');
        badge.className = 'tap-badge';
        badge.textContent = '→';
        hs.appendChild(badge);

        // EN overlay label
        const lbl = document.createElement('div');
        lbl.className = 'en-overlay-label';
        lbl.id = 'enLabel' + i;
        const nameSpan = document.createElement('span');
        nameSpan.className = 'en-name';
        nameSpan.textContent = item.name_en;
        const priceSpan = document.createElement('span');
        priceSpan.className = 'en-price';
        priceSpan.textContent = item.price_jpy ? '≈ ' + formatPrice(item.price_jpy) : '';
        lbl.appendChild(nameSpan);
        lbl.appendChild(priceSpan);
        hs.appendChild(lbl);

        container.appendChild(hs);
      });

      document.getElementById('detectedCount').innerHTML =
        '<strong>' + TEST_DATA.items.length + ' item' + (TEST_DATA.items.length > 1 ? 's' : '') + '</strong> detected · Tap to translate';
    }

    // ── Overlay toggle ──
    let overlayOn = false;
    function toggleOverlay() {
      overlayOn = !overlayOn;
      document.getElementById('overlayToggleBtn').classList.toggle('on', overlayOn);
      document.querySelectorAll('.en-overlay-label').forEach(el => el.classList.toggle('visible', overlayOn));
      const ibText = document.querySelector('.ib-text');
      if (overlayOn) {
        ibText.innerHTML = '<strong>Overview mode ON</strong> — tap any item for full details.';
      } else {
        ibText.innerHTML = '<strong>Tap any highlighted item</strong> on the menu photo to see the English translation and allergy info.';
      }
    }

    // ── Bottom sheet ──
    const ALLERGEN_TYPES = { Shellfish: 'danger', Fish: 'danger', Egg: 'danger', Milk: 'danger', Peanut: 'danger', 'Tree Nuts': 'danger', Soy: 'warn', Wheat: 'warn', Sesame: 'warn', Buckwheat: 'warn' };

    function openSheet(idx) {
      const item = TEST_DATA.items[idx];
      document.querySelectorAll('.hotspot').forEach((h, i) => h.classList.toggle('active', i === idx));

      const allergyHTML = item.allergens.map(a => {
        const type = ALLERGEN_TYPES[a] || 'warn';
        return '<span class="tag tag-' + type + '">' + a + '</span>';
      }).join('');

      const confClass = item.confidence === 'high' ? 'conf-high' : 'conf-low';
      const confIcon = item.confidence === 'high' ? '✓' : '⚠';
      const confText = item.confidence === 'high' ? 'High OCR confidence' : 'Low confidence — verify with menu';

      document.getElementById('sheetContent').innerHTML =
        '<div class="sheet-header">' +
        '<div>' +
        '<div class="sheet-jp">' + item.name_jp + '</div>' +
        '<div class="sheet-en">' + item.name_en + '</div>' +
        '</div>' +
        '<div>' +
        (item.price_jpy ? '<div class="sheet-jpy">¥' + item.price_jpy + '</div>' +
          '<div class="sheet-usd">≈ ' + formatPrice(item.price_jpy) + ' ' + currentCurrency + '</div>' : '') +
        '</div>' +
        '</div>' +
        '<div class="sheet-divider"></div>' +
        '<div class="sheet-desc">' + item.description_en + '</div>' +
        '<div class="allergy-section">' +
        '<div class="allergy-heading">Allergens detected</div>' +
        '<div class="allergy-tags">' + allergyHTML + '</div>' +
        '</div>' +
        '<div class="confidence-badge ' + confClass + '">' + confIcon + ' ' + confText + '</div>' +
        '<div class="ai-disclaimer">' +
        '<span>⚠️</span>' +
        '<p><strong>AI-estimated.</strong> Always confirm allergy info with staff if you have a food allergy.</p>' +
        '</div>';

      document.getElementById('sheetBackdrop').classList.add('open');
      document.getElementById('bottomSheet').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('sheetBackdrop').classList.remove('open');
      document.getElementById('bottomSheet').classList.remove('open');
      document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active'));
    }

    // ── Init ──
    window.addEventListener('load', () => {
      const img = document.getElementById('menuPhoto');
      function start() {
        buildOverlay();
        setTimeout(() => {
          document.getElementById('scanOverlay').classList.add('hidden');
          document.getElementById('hintLabel').textContent = TEST_DATA.items.length + ' item' + (TEST_DATA.items.length > 1 ? 's' : '') + ' found';
          document.getElementById('detectedBar').classList.add('visible');
          document.getElementById('instructionBanner').classList.add('visible');
          // Pulse hotspots
          TEST_DATA.items.forEach((_, i) => {
            setTimeout(() => {
              const hs = document.getElementById('hs' + i);
              hs.classList.add('pulsing');
              setTimeout(() => hs.classList.remove('pulsing'), 700);
            }, i * 160);
          });
        }, 2000);
      }
      if (img.complete) start(); else img.onload = start;
    });
  </script>
</body>
